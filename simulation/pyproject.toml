[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "booster-soccer-sim"
version = "0.1.0"
description = "Parameterised MuJoCo RoboCup HSL 3v3 field and contact passing baseline"
requires-python = ">=3.10,<3.14"
dependencies = ["mujoco==3.3.7", "numpy>=1.24,<3", "PyYAML>=6,<7", "imageio>=2.34,<3", "imageio-ffmpeg>=0.5,<1", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
policy = ["onnxruntime>=1.23,<2"]
wm = ["onnxruntime>=1.23,<2", "torch>=2.7,<3"]
analysis = ["matplotlib>=3.8,<4"]

[project.scripts]
soccer-sim = "soccer_sim.cli:main"
soccer-policy = "soccer_sim.policy_runner:main"

[tool.setuptools.packages.find]
include = ["soccer_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
